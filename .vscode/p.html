<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Calculator</title>
    <style>
        body {
            font-size: larger;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            flex-direction: calc();
            text-align: center;     
            margin: 20px;
            text-shadow: 0cqb;
            text-size-adjust: 30;
	        background-repeat : no-repeat;
	        background-size : 100% 100%;
	        background-attachment : fixed;
            color: #24ebe1;
            border-inline-color: white;
        }
    </style>
</head>
   <body background="https://media.giphy.com/media/Ks1SE2JXbPibm/giphy.gif">
<body>
    <h1 style="color:rgb(72, 235, 31);">Planet Weight Calculator</h1>

    <label style="color: #e46262;"  for="earthWeight">Enter your weight on Earth (kg): </label>
    <input type="number" id="earthWeight" placeholder="Enter weight" step="0.1" min="0">

    <button onclick="calculateWeight()">Calculate</button>
    <div id="results"></div>

    <script>
        function calculateWeight() {
            const earthWeight = parseFloat(document.getElementById("earthWeight").value);

            if (isNaN(earthWeight) || earthWeight <= 0) {
                alert("Please enter a valid weight on Earth.");
                return;
            }

            const planets = [
                { name: "Mercury", gravity: 0.38 },    
                { name: "Venus", gravity: 0.91 },
                { name: "Mars", gravity: 0.38 },
                { name: "Jupiter", gravity: 2.34 },
                { name: "Saturn", gravity: 1.06 },
                { name: "Uranus", gravity: 0.92 },
                { name: "Neptune", gravity: 1.14 },
                { name: "Pluto", gravity: 0.06 },  // Yes, Pluto!
                { name: "moon", gravity: 0.6},
            ]
            let resultsHTML = "<h2>Weight on Different Planets:</h2><ul>";

            planets.forEach(planet => {
                const planetWeight = (earthWeight * planet.gravity).toFixed(2);
                resultsHTML += `<li>${planet.name}: ${planetWeight} kg</li>`;
            });

            resultsHTML += "</ul>";

            document.getElementById("results").innerHTML = resultsHTML;
        
        }
    </script>

</body>
</html>
