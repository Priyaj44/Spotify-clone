<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --text-color: #333;
      --heading-color: #2c3e50;
      --link-color: #3498db;
      --hover-color: #1abc9c;
      --card-bg: #ffffff;
      --card-border: #3498db;
    }

    body.dark {
      --bg-color: #1e1e2f;
      --text-color: #f0f0f0;
      --heading-color: #00ffff;
      --link-color: #00bcd4;
      --hover-color: #00e5ff;
      --card-bg: #2a2a3b;
      --card-border: #00bcd4;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      transition: all 0.3s ease;
    }

    h1 {
      text-align: center;
      color: var(--heading-color);
    }

    h2 {
      margin-top: 30px;
      color: var(--link-color);
    }

    a {
      text-decoration: none;
      color: var(--link-color);
      font-weight: bold;
    }

    a:hover {
      color: var(--hover-color);
    }

    .bookmark {
      margin: 10px 0;
      padding: 12px;
      background-color: var(--card-bg);
      border-left: 5px solid var(--card-border);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      transition: transform 0.2s;
    }

    .bookmark:hover {
      transform: scale(1.02);
    }

    .toggle-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      background-color: var(--link-color);
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .toggle-btn:hover {
      background-color: var(--hover-color);
    }
  </style>
</head>
<body>

  <h1>My Bookmarks</h1>

  <button class="toggle-btn" onclick="toggleMode()">Toggle Light/Dark Mode</button>

  <h2>Primary Bookmarks</h2>
  <div class="bookmark"><a href="https://www.google.com" target="_blank">Open Google</a></div>
  <div class="bookmark"><a href="https://www.youtube.com" target="_blank">Open YouTube</a></div>
  <div class="bookmark"><a href="https://www.instagram.com" target="_blank">Open Instagram</a></div>
  <div class="bookmark"><a href="https://www.facebook.com" target="_blank">Open Facebook</a></div>

  <h2>Secondary Bookmarks</h2>
  <div class="bookmark"><a href="https://www.wikipedia.org" target="_blank">Open Wikipedia</a></div>
  <div class="bookmark"><a href="https://www.stackoverflow.com" target="_blank">Open Stack Overflow</a></div>

  <script>
    function toggleMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
